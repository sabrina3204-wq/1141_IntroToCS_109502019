<!DOCTYPE html>
<html>
<head>
    <title>Number Guessing Game</title>
</head>
<body>

<h1>109502019_Number Guessing Game</h1>

<!-- 空 div：最後要放圖片 -->
<div id="result"></div>

<script>
    // 1～100 隨機答案
    var answer = Math.floor(Math.random() * 100) + 1;

    var min = 1;
    var max = 100;
    var chances = 7;  // 最大 7 次

    while (chances > 0) {

        // 提示用戶目前範圍 + 剩餘次數
        var input = window.prompt(
            "請輸入數字 (" + min + " 到 " + max + ")\n" +
            "剩餘次數：" + chances
        );

        // ********** input 檢查 **********

        // 取消或空白
        if (input === null || input.trim() === "") {
            alert("輸入不得為空！");
            continue;
        }

        // 非數字
        if (isNaN(input)) {
            alert("請輸入有效的數字！");
            continue;
        }

        var guess = Number(input);

        // 過界
        if (guess < min || guess > max) {
            alert("超出範圍！請輸入 " + min + " ~ " + max + " 之間的數字！");
            continue;
        }

        // ********** 判斷大小 **********
        chances--;

        if (guess === answer) {
            alert("恭喜你答對了！");
            document.getElementById("result").innerHTML =
                "<img src='images/correct.jpg' width='300'>";
            break;
        }

        if (guess > answer) {
            max = guess - 1;
        } else {
            min = guess + 1;
        }

        // ********** 次數用完 **********
        if (chances === 0) {
            alert("很可惜，答案是：" + answer);
            document.getElementById("result").innerHTML =
                "<img src='images/wrong.jpg' width='300'>";
        }
    }
</script>

</body>
</html>
