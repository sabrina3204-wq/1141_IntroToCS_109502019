<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Calculator</title>
    <link rel="stylesheet" href="109502910_JS2_HW8.css">
</head>
<body>

<div class="calculator">
    <h1>JS Calculator</h1>

    <label>Number 1</label>
    <input type="number" id="num1">

    <label>Number 2</label>
    <input type="number" id="num2">

    <label>Operate way?</label>
    <select id="operator">
        <option value="+">+</option>
        <option value="-">−</option>
        <option value="*">×</option>
        <option value="/">÷</option>
    </select>

    <button id="calcBtn">Calculate</button>

    <p id="result">Result = </p>
</div>

<script src="109502910_JS2_HW8.js"></script>
</body>
</html>
